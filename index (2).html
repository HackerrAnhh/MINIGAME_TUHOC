const C=(question,options,answer,why,hint='',time=35)=>({type:'choice',question,options,answer,why,hint,time});
const T=(question,answer,why,hint='')=>({type:'tf',question,answer:answer?0:1,why,hint,time:24});

const O=(question,steps,why,hint='')=>({type:'order',question,steps,why,hint,time:70});
const R=(question,words,decoys,why,study=12)=>({type:'memory',question,words,decoys,why,study,time:85,hint:'Gom từ thành những nhóm nhỏ, sau đó che đi và tự nhắc lại.'});

const STAGES=[
{id:1,icon:'⚡',name:'Khởi động tia chớp',difficulty:'DỄ',base:10,brief:'4 câu mở khóa năng lượng. Chỉ cần nhanh tay chọn câu đúng để khởi động lớp học!',teacher:'Cả lớp cùng hô “3–2–1” rồi đội đến lượt mới được trả lời. Đội khác không nói đáp án.',quests:[
 C('Tự học có định hướng bắt đầu từ việc gì?',['Học mọi thứ cùng lúc','Xác định mình cần học gì và kết quả cần đạt','Chép đầy đủ lời giải của bạn','Chỉ chọn nội dung mình thích'],1,'Bước đầu tiên là xác định điều cần học và đích cần đạt.','Nghĩ tới chữ “định hướng”.'),
 C('Một cách học thực sự phù hợp phải giúp người học…',['Ngồi học lâu nhất','Xem nhiều video nhất','Thực hiện được đúng nhiệm vụ cần đạt','Ghi chép nhiều nhất'],2,'Hiệu quả được đánh giá theo việc hoàn thành nhiệm vụ, không chỉ thời gian học.'),

 C('Nếu tự kiểm tra thấy chưa đạt, em nên…',['Bỏ qua vì đã cố gắng','Học lại hoặc đổi cách học rồi thử lại','Chỉ tăng thời gian đọc','Đợi lần kiểm tra tiếp theo'],1,'Cần điều chỉnh cách học, thử lại và so sánh kết quả mới.')
]},
{id:2,icon:'🕵️',name:'Giải cứu bạn Minh',difficulty:'DỄ',base:15,brief:'Minh muốn sáng mai tự giải phương trình bậc hai. Trổ tài thám tử để tìm cách học hiệu quả nhất.',teacher:'Sau câu trả lời, yêu cầu học sinh nêu một chi tiết làm căn cứ. Có thể cho đội khác tranh luận 10 giây.',quests:[
 C('Minh muốn sáng mai tự giải một bài tương tự, không nhìn lời giải. Minh nên chọn cách nào?',['A. Đọc lại công thức và lời giải 3 lần','B. Xem mẫu, che lời giải, tự làm bài tương tự và xem đúng bước vướng','C. Xem video từ đầu đến cuối','D. Chỉ hỏi bạn bè xem bài có khó không'],1,'Cách B tạo cơ hội tự giải và phát hiện đúng bước chưa biết. (Bài giảng trang 3–7).'),
 C('Chi tiết “đắt giá” nhất trong cách B là gì?',['Xem bài mẫu thật lâu','Học đến khuya','Tự làm một bài tương tự khi đã che lời giải','Mở video giải bài ở tốc độ chậm'],2,'Chính việc tự làm không nhìn lời giải mới kiểm chứng khả năng giải bài.'),
 C('Minh bị mắc ở bước 2 khi tự giải. Cách ứng xử nào phù hợp nhất?',['Mở toàn bộ đáp án và chép','Bỏ bài và chuyển sang bài dễ hơn','Xem lại đúng bước mắc, sửa rồi tiếp tục tự làm','Xem lại cả video dù đã hiểu các bước khác'],2,'Chỉ xem đúng phần vướng để hỗ trợ rồi quay lại tự làm.'),
 C('Chỉ đọc lại lời giải nhiều lần chưa đủ, bởi vì…',['Đọc luôn gây mất tập trung','Chưa chứng minh được mình có thể tự giải','Công thức luôn không cần thiết','Không ai ghi nhớ bằng cách đọc'],1,'Cần phân biệt cảm giác quen thuộc khi đọc với khả năng thực hiện nhiệm vụ.')
]},
{id:3,icon:'✅',name:'Đúng hay là bẫy?',difficulty:'DỄ',base:15,brief:'Đúng – Sai liên hoàn! Phân biệt cảm giác “đã học” và kết quả học thật.',teacher:'Mỗi đội phải giơ tay hoặc đứng lên nếu chọn ĐÚNG, ngồi xuống nếu chọn SAI, rồi mới bấm đáp án.',quests:[
 T('Đọc một đoạn sáu lần đồng nghĩa với việc chắc chắn đã hiểu đoạn đó.',false,'Đọc nhiều lần chưa chứng minh được đã hiểu; cần tự giải thích lại.'),
 T('Mục tiêu khác nhau có thể cần cách học và cách tự kiểm tra khác nhau.',true,'Muốn nhớ, muốn làm được và muốn hiểu cần cách học/tự kiểm tra phù hợp.'),
 T('Muốn nhớ, có thể che tài liệu rồi tự nói lại những từ khóa đã học.',true,'Tự nhắc lại không nhìn tài liệu là một cách kiểm tra trí nhớ.'),
 T('Muốn làm được, chỉ cần xem hai bài giải mẫu thật kĩ.',false,'Muốn làm được cần tự giải một bài tương tự và biết sửa chỗ sai.'),
 T('Sau khi đổi cách học, cần thử lại và so sánh kết quả.',true,'Điều chỉnh phải dựa trên kết quả mới, không chỉ trên cảm giác.')
]},
{id:4,icon:'🧩',name:'Ghép đôi thần tốc',difficulty:'TRUNG BÌNH',base:25,brief:'Nối đúng MỤC TIÊU – CÁCH HỌC – TỰ KIỂM TRA bằng thao tác chọn đáp án cho từng dòng.',teacher:'Cho đội cử hai bạn lên bảng: một bạn đọc cột trái, một bạn chọn cột phải. Cả đội được bàn bạc 15 giây.',quests:[
 M('Ghép mỗi mục tiêu với cách học phù hợp nhất.',[
 ['Muốn NHỚ','Chia nhỏ, che tài liệu và tự nhắc lại'],['Muốn LÀM ĐƯỢC','Xem mẫu, tự làm và sửa lỗi'],['Muốn HIỂU','Tìm ý chính, giải thích bằng lời mình'],['Kết quả CHƯA ĐẠT','Điều chỉnh cách học rồi thử lại']], 'Mục tiêu khác nhau → cách học phù hợp cũng khác nhau. (Trang 11–18).'),
 M('Ghép mục tiêu với cách TỰ KIỂM TRA phù hợp.',[
 ['Đã nhớ 6 từ khóa?','Không nhìn và nói lại đủ 6 từ'],['Đã làm được dạng toán?','Tự giải trọn vẹn bài tương tự'],['Đã hiểu khái niệm?','Tự giải thích rõ cho bạn nghe'],['Đổi cách học có hiệu quả?','Thử lại, đối chiếu kết quả mới']], 'Tự kiểm tra phải đo được đúng mục tiêu của người học.')
]},
{id:5,icon:'🧭',name:'La bàn chiến lược',difficulty:'TRUNG BÌNH',base:30,brief:'Các bước bị xáo trộn. Bấm ↑ ↓ để sắp xếp lại thứ tự cho chính xác.',teacher:'Chọn một “đội trưởng chiến thuật” đưa ra quyết định, các thành viên chỉ được góp ý bằng tối đa 3 từ.',quests:[
 O('Sắp xếp đúng quy trình tự học có định hướng (4 bước).',['Xác định nội dung cần học và kết quả cần đạt','Chọn cách học phù hợp','Học xong tự kiểm tra lại','Chưa đạt: đổi cách học và làm lại'],'Đây là quy trình 4 bước xuyên suốt bài giảng (trang 30 và 33).'),
 O('Sắp xếp cách luyện để thực sự LÀM ĐƯỢC dạng bài.',['Xem một bài mẫu và nhận diện các bước','Che lời giải, tự làm bài tương tự','Đối chiếu, tìm chỗ sai và tự sửa'],'Muốn làm được: xem mẫu → tự làm → sửa lỗi (trang 14).'),
 O('Sắp xếp cách học để thực sự HIỂU một khái niệm.',['Tìm ý chính và những điều quan trọng','Tự nói lại bằng lời của mình','Giải thích cho bạn nghe, không nhìn tài liệu'],'Muốn hiểu: tìm ý chính → nói lại → giải thích (trang 16).')
]},
{id:6,icon:'👀',name:'Trí nhớ siêu tốc',difficulty:'TRUNG BÌNH',base:35,brief:'Nhìn 6 từ khóa trong vài giây. Khi thẻ bị che, tìm đúng 6 từ giữa 9 ô!',teacher:'Không cho lớp chụp ảnh màn hình hay ghi lại lúc xem. Đội được nói nhỏ để nhớ theo cụm từ.',quests:[
 R('Ghi nhớ 6 từ khóa về tự học có định hướng.', ['Mục tiêu','Cách học','Tự kiểm tra','Điều chỉnh','Thử lại','Kết quả'],['May mắn','Bắt chước','Điểm danh'],'Chia nhóm các từ, tự nhắc lại mà không nhìn tài liệu là cách học theo mục tiêu NHỚ.',12),
 R('Ghi nhớ 6 từ khóa của ba mục tiêu học tập.', ['Nhớ','Tự nhắc lại','Làm được','Tự làm','Hiểu','Giải thích'],['Chép nguyên văn','Đọc mãi','Chỉ xem video'],'Ba cặp là Nhớ–Tự nhắc lại, Làm được–Tự làm, Hiểu–Giải thích.',10)
]},
{id:7,icon:'🔍',name:'Phòng khám cách học',difficulty:'KHÓ',base:35,brief:'Ba “bệnh nhân” Phương – Khải – An đang học chưa hiệu quả. Chẩn đoán và kê đúng phương án!',teacher:'Phân vai: một học sinh diễn Phương/Khải/An, một bạn làm cố vấn học tập; khán giả vỗ tay theo nhịp.',quests:[
 C('Phương đọc khái niệm 4 lần, đóng tài liệu chỉ nhớ từ rời rạc. Dấu hiệu nào cho thấy chưa đạt?',['Phương chưa học đủ 5 lần','Phương chưa nói được khái niệm thành câu bằng lời mình','Phương dùng giấy bút','Phương học quá nhanh'],1,'Phương không tự diễn đạt được khi đóng tài liệu (trang 21).'),
 C('Phương nên điều chỉnh bằng cách nào?',['Tiếp tục đọc toàn bài thêm 10 lần','Chép toàn bộ vào vở','Đọc từng phần ngắn, đóng tài liệu và tự nói lại','Chỉ gạch chân câu quan trọng'],2,'Đọc ngắn, nói lại, chưa rõ thì xem lại và thử lại (trang 22).'),
 C('Khải xem hai lời giải mẫu, nhưng tự làm dừng ở bước thứ hai. Vấn đề chính là…',['Thiếu khả năng nhớ tên bài','Chưa làm được trọn vẹn nhiệm vụ dù đã xem mẫu','Do bài mẫu luôn sai','Chưa xem đủ ba video'],1,'Khải có cảm giác hiểu nhưng chưa tự giải được các bước.'),
 C('Khải cần làm gì ở bước bị vướng?',['Xem lại đúng bước đó, rồi quay lại tự làm tiếp','Bỏ bài toán đang làm','Chép cả lời giải','Đợi thầy cô giải lại toàn bộ'],0,'Điều chỉnh đúng chỗ vướng, sau đó tiếp tục tự làm và kiểm tra (trang 24).'),
 C('An thuộc nguyên văn ghi nhớ nhưng không trả lời được “Vì sao?”. An thiếu điều gì?',['Khả năng thuộc từng chữ','Khả năng giải thích bằng lời của mình','Số lượng vở ghi','Thời gian đọc to'],1,'Học thuộc không đồng nghĩa với hiểu sâu (trang 25).'),
 C('An nên làm gì để kiểm tra đã hiểu?',['Đọc to thêm lần nữa','Nhìn tài liệu kể nguyên văn','Chọn 3 từ khóa, giải thích lại và trả lời câu hỏi “Vì sao?”','Chép ra giấy thật đẹp'],2,'Tự giải thích không nhìn tài liệu, phát hiện chỗ không trả lời được để học lại (trang 26).')
]},
{id:8,icon:'🚀',name:'Đấu trường phản xạ',difficulty:'KHÓ',base:40,brief:'6 câu Đúng/Sai áp lực thời gian. Càng trả lời đúng liên tiếp càng có cơ hội cộng điểm!',teacher:'Mỗi câu chỉ khoảng 24 giây. Đội chơi được chọn 1 người phản xạ nhanh để ra tín hiệu trả lời.',quests:[
 T('Nếu em nhớ được công thức nhưng không tự giải nổi bài tương tự, mục tiêu “làm được” đã đạt.',false,'Biết công thức không đủ; cần tự giải được bài.'),
 T('Một người có thể “nhớ” định nghĩa mà chưa chắc “hiểu” định nghĩa ấy.',true,'Ghi nhớ và hiểu sâu là hai mục tiêu khác nhau.'),
 T('Tự kiểm tra nên bám sát nhiệm vụ cần đạt ngay từ đầu.',true,'Cách tự kiểm tra cần đo được kết quả mong muốn.'),
 T('Chưa đạt mục tiêu thì nhất thiết phải chuyển sang một môn khác.',false,'Cần học lại hoặc điều chỉnh rồi kiểm tra tiếp.'),
 T('Cảm giác “bài này quen quá” có thể khác với khả năng tự làm.',true,'Sự quen thuộc không đủ chứng minh năng lực thực hiện nhiệm vụ.'),
 T('Đã đổi cách học thì không cần thử lại vì cách mới chắc chắn tốt hơn.',false,'Phải thử lại và xem kết quả có được cải thiện không.')
]},
{id:9,icon:'🎯',name:'Chọn đường khôn ngoan',difficulty:'KHÓ',base:45,brief:'Mỗi tình huống chỉ có một con đường phù hợp nhất. Lựa chọn sai sẽ bỏ lỡ cơ hội ghi điểm!',teacher:'Cho 10 giây tranh luận rồi khóa quyền phát biểu; đại diện chốt lựa chọn và nêu lí do.',quests:[
 C('Ngày mai cần nhớ 6 từ khóa. Kế hoạch tốt nhất là…',['Đọc lướt đủ 6 từ 20 lần','Chia từ thành 2–3 nhóm, đọc, che lại và tự nói đủ 6 từ','Ghi cả đoạn văn dài hơn','Đọc đúng 1 lần rồi nghỉ'],1,'Chia nhỏ kết hợp tự nhắc lại giúp kiểm tra đúng mục tiêu “nhớ”.'),
 C('Mục tiêu là giải thích “tự học có định hướng” cho bạn khác. Em nên…',['Học thuộc chính xác 100% câu chữ','Chỉ xem sơ đồ của người khác','Xác định ý chính rồi tự giải thích bằng lời mình','Viết thật nhiều mà không nói'],2,'Mục tiêu hiểu cần tự diễn đạt rõ và trả lời được câu hỏi.'),
 C('Học cách giải toán: em đã tự làm đúng, không nhìn mẫu. Dấu hiệu nào đáng tin cậy nhất?',['Đã hoàn thành đúng bài tương tự và kiểm tra kết quả','Thích môn Toán hơn','Xem video trên 2 giờ','Ghi được 8 trang vở'],0,'Kết quả thực hiện nhiệm vụ mới là căn cứ đánh giá.'),
 C('Sau khi đổi cách học, điểm tự kiểm tra vẫn không cải thiện. Hành động phù hợp là…',['Cho rằng đã đạt rồi','Phân tích phần chưa đạt và tiếp tục điều chỉnh','Không cần học nữa','Chỉ tăng thời lượng đọc'],1,'Dựa vào kết quả mới để quyết định tiếp tục điều chỉnh.'),
 C('Hai học sinh cùng học 30 phút nhưng một bạn đã tự giải được bài, một bạn chỉ xem lời giải. Kết luận nào đúng nhất?',['Hai bạn chắc chắn hiệu quả như nhau','Bạn xem nhiều hơn luôn giỏi hơn','Cần nhìn vào kết quả theo mục tiêu đã đặt, không chỉ số phút học','Ai học nhanh hơn thì không cần kiểm tra'],2,'Đo hiệu quả theo nhiệm vụ cần đạt, tránh chỉ đếm thời gian học.')
]},

const TOTAL_QUESTIONS=STAGES.reduce((n,s)=>n+s.quests.length,0);
const STORAGE_KEY='hocba_dautruong_v4';
const DEFAULT_STATE=()=>({phase:'welcome',stage:0,q:0,teamCount:3,teams:['Đội Sao Băng','Đội Tia Chớp','Đội Siêu Trí','Đội Bứt Phá'],scores:[0,0,0,0],turn:0,streak:0,solved:0,correct:0,completed:[],sound:true,timerOn:true,history:[]});
let state=loadState();let runtime={selection:null,order:[],match:[],memChosen:[],memReveal:true,memStudyLeft:0,feedback:null,hint:false,timerLeft:0,ticker:null,startedSpeech:false,endedByTimeout:false,working:false,backFromMap:null};
function loadState(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!d||!Array.isArray(d.scores)||!Array.isArray(d.teams)||!Number.isInteger(d.stage)||d.stage<0||d.stage>=STAGES.length)return DEFAULT_STATE();return {...DEFAULT_STATE(),...d,phase:d.phase==='play'?'intro':d.phase};}catch(e){return DEFAULT_STATE()}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const randomShuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function timeText(s){return `${Math.floor(Math.max(0,s)/60).toString().padStart(2,'0')}:${(Math.max(0,s)%60).toString().padStart(2,'0')}`}
function stopTimer(){if(runtime.ticker){clearInterval(runtime.ticker);runtime.ticker=null}}
function showToast(msg){const layer=$('toastLayer');layer.innerHTML=`<div class="toast-custom" role="status">${escapeHTML(msg)}</div>`;clearTimeout(showToast.t);showToast.t=setTimeout(()=>layer.innerHTML='',2600)}
function sound(freq=650,dur=.12,type='sine'){if(!state.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;const ctx=sound.ctx||(sound.ctx=new AC());const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,ctx.currentTime);gain.gain.setValueAtTime(.075,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur)}catch(e){}}
function successSound(){sound(523,.13);setTimeout(()=>sound(784,.16),100);setTimeout(()=>sound(1046,.23),215)}
function errorSound(){sound(210,.23,'triangle')}
function confetti(n=45){const colors=['#66f0d1','#fac86d','#ad86ff','#ff7999','#78bfff'];for(let i=0;i<n;i++){let c=document.createElement('div');c.className='confetti';c.style.cssText=`left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};--dx:${Math.random()*180-90}px;--dur:${2+Math.random()*2.4}s;transform:rotate(${Math.random()*360}deg);animation-delay:${Math.random()*.4}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),4900)}}
function controlSound(){state.sound=!state.sound;save();$('btnSound').textContent=state.sound?'🔊 Âm thanh':'🔇 Tắt tiếng';if(state.sound)sound(760,.1)}
function applyGlobal(){ $('btnSound').textContent=state.sound?'🔊 Âm thanh':'🔇 Tắt tiếng'; }
function showModal(inner){$('modalLayer').innerHTML=`<div class="modal-backdrop-custom" id="overlay"><section class="modal-content-custom" role="dialog" aria-modal="true" aria-label="Thông tin trò chơi"><button class="ghost-btn modal-close" id="closeModal">✕ Đóng</button>${inner}</section></div>`;$('closeModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()}}
function closeModal(){$('modalLayer').innerHTML=''}
function showHelp(){showModal(`<h2>🎮 Luật chơi cho giáo viên</h2><p>Chia lớp thành 2–4 đội. Các đội thay phiên chơi 12 cửa ải với tổng <b>${TOTAL_QUESTIONS} thử thách</b>. Giáo viên điều khiển trên màn chiếu.</p><div class="rule">⚡ <b>Chọn đáp án / Đúng–Sai:</b> Đội chọn một ô, bấm “Chốt đáp án”.</div><div class="rule">🧩 <b>Ghép cặp:</b> Chọn nội dung tương ứng ở mỗi dòng, rồi chốt.</div><div class="rule">🧭 <b>Sắp xếp:</b> Bấm ▲ ▼ để đổi thứ tự các bước.</div><div class="rule">👀 <b>Trí nhớ:</b> Xem 6 từ khóa, che lại và chọn đủ 6 từ đúng.</div><div class="rule">🎤 <b>Thuyết trình:</b> Bấm bắt đầu 60 giây, học sinh nói; giáo viên chọn ĐẠT / CHƯA ĐẠT theo tiêu chí.</div><div class="rule">🏆 <b>Điểm:</b> Tăng theo độ khó; trả lời nhanh có điểm cộng thời gian; dùng gợi ý giảm 20% điểm; liên tiếp 3 câu đúng thưởng 5 điểm.</div><div class="rule">⏱️ <b>Hết giờ:</b> Tự tính chưa đạt (trừ phần thuyết trình). Giáo viên có thể gia hạn hoặc tắt đồng hồ.</div><div class="rule">⌨️ <b>Phím tắt:</b> 1–4 chọn phương án, Enter chốt/trang tiếp, Esc đóng cửa sổ.</div><div class="rule">💾 <b>Lưu:</b> Điểm và các màn đã qua tự lưu trong trình duyệt trên máy đang dùng.</div><p class="mt-3">💡 Gợi ý: Dùng nút <b>⛶ Phóng to</b> để chiếu cả lớp, mời học sinh giải thích lí do sau mỗi câu. <b>Không bắt buộc kết nối internet</b> để chơi: game và kiểu chữ/trang trí cốt lõi đã nằm trong tệp HTML.</p><button class="btn-main mt-3" onclick="closeModal()">Đã rõ – Vào lớp thôi! 🚀</button>`)}
function showSettings(){showModal(`<h2>⚙️ Bảng điều khiển giáo viên</h2><p>Đổi luật chơi phù hợp với lớp; thao tác có hiệu lực ngay.</p><div class="rule"><label style="display:flex;align-items:center;gap:12px"><input type="checkbox" id="toggleClock" ${state.timerOn?'checked':''} style="width:20px;height:20px"> Bật đồng hồ đếm ngược cho các câu hỏi</label></div><div class="rule">Đội đang trả lời: <b>${escapeHTML(state.teams[state.turn])}</b><div class="mt-3" style="display:flex;gap:8px;flex-wrap:wrap">${state.teams.slice(0,state.teamCount).map((t,i)=>`<button class="ghost-btn ${state.turn===i?'active':''}" data-team-set="${i}">${escapeHTML(t)}</button>`).join('')}</div></div><div class="rule">Chỉnh điểm đội hiện tại: <button class="ghost-btn" data-add="-10">−10</button> <button class="ghost-btn" data-add="10">+10</button></div><div class="rule"><button class="ghost-btn" id="downloadCSV">📥 Xuất bảng điểm CSV</button></div><div class="rule"><button class="ghost-btn" id="resetGame" style="border-color:#ff86988a;color:#ffaeb8">🔄 Xóa điểm và chơi lại từ đầu</button></div>`);$('toggleClock').onchange=e=>{state.timerOn=e.target.checked;save();if(state.phase==='play'){if(state.timerOn&&runtime.feedback===null&&runtime.ticker===null)startTimer();if(!state.timerOn)stopTimer()}updateHUD()};document.querySelectorAll('[data-team-set]').forEach(x=>x.onclick=()=>{state.turn=+x.dataset.teamSet;save();closeModal();render()});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{state.scores[state.turn]=Math.max(0,state.scores[state.turn]+Number(x.dataset.add));save();closeModal();render()});$('downloadCSV').onclick=downloadCSV;$('resetGame').onclick=()=>{if(confirm('Xóa toàn bộ điểm và hành trình hiện tại để chơi lại từ đầu?')){stopTimer();state=DEFAULT_STATE();save();closeModal();render();showToast('Đã tạo một lượt chơi mới!')}}}
function downloadCSV(){const lines=[['Đội','Điểm','Số chặng hoàn thành','Số câu đã chơi','Số câu đúng'],...state.teams.slice(0,state.teamCount).map((n,i)=>[n,state.scores[i],state.completed.length,state.history.filter(h=>h.team===i).length,state.history.filter(h=>h.team===i&&h.correct).length])];const data='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8;'}));a.download='bang_diem_hoc_ba_dau_truong.csv';document.body.appendChild(a);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);a.remove()}
function qCountBefore(stage){return STAGES.slice(0,stage).reduce((a,s)=>a+s.quests.length,0)}
function statTotal(){const tally=STAGES.reduce((x,s)=>x+s.quests.length,0);return tally}
function render(){stopTimer();applyGlobal();if(state.phase==='welcome')renderWelcome();else if(state.phase==='map')renderMap();else if(state.phase==='intro')renderIntro();else if(state.phase==='stageend')renderStageEnd();else if(state.phase==='finish')renderFinish();else renderPlay(true)}
function renderWelcome(){const inputs=state.teams.slice(0,state.teamCount).map((t,i)=>`<input class="field" maxlength="25" id="teamName${i}" value="${escapeHTML(t)}" aria-label="Tên đội ${i+1}">`).join('');$('app').innerHTML=`<div class="screen"><section class="panel intro-panel"><span class="pill warm">🏆 SIÊU MINI GAME TƯƠNG TÁC • DÀNH CHO LỚP 10</span><h1 class="mega-title">HỌC BÁ<br><span class="gradient-text">ĐẤU TRƯỜNG!</span></h1><p class="lead">Từ “học cho có” thành “học để làm được”. Cùng vượt 12 thử thách ngày càng khó và đánh bại TRÙM CUỐI để trở thành <b>Nhà vô địch tự học!</b></p><div class="game-facts"><div class="fact"><strong>12</strong><span>CỬA ẢI</span></div><div class="fact"><strong>${TOTAL_QUESTIONS}</strong><span>THỬ THÁCH</span></div><div class="fact"><strong>2–4</strong><span>ĐỘI THI</span></div><div class="fact"><strong>30–55′</strong><span>THỜI GIAN GỢI Ý</span></div></div><div class="team-config"><div><label class="field-label" for="teamCount">Số đội trong lớp</label><select id="teamCount" class="field"><option value="2" ${state.teamCount===2?'selected':''}>2 đội</option><option value="3" ${state.teamCount===3?'selected':''}>3 đội</option><option value="4" ${state.teamCount===4?'selected':''}>4 đội</option></select></div><div><label class="field-label">Tên các đội (có thể sửa)</label><div id="teamInputs" class="team-inputs">${inputs}</div></div></div><div class="hero-actions"><button class="btn-main" id="startGame">🚀 BẮT ĐẦU CHIẾN!</button><button class="btn-secondary-custom" id="seeMap">🗺️ Xem 12 cửa ải</button><button class="btn-secondary-custom" id="teacherRules">📋 Luật chơi</button></div><div class="coach">✦ Giữ điểm tự động • Âm thanh vui nhộn • Máy chiếu / điện thoại / máy tính • Chơi được không cần mạng</div></section><div class="welcome-bottom"><div class="mini-panel"><span class="emoji">🎯</span><b>Học đúng mục tiêu</b><span>Nhớ – Làm được – Hiểu</span></div><div class="mini-panel"><span class="emoji">🔍</span><b>Biết tự đánh giá</b><span>Phát hiện nơi chưa đạt và sửa</span></div><div class="mini-panel"><span class="emoji">🎤</span><b>Ai cũng được lên tiếng</b><span>Thảo luận, giải mã, thử trí nhớ và nói 60 giây</span></div></div></div>`;$('teamCount').onchange=e=>{collectTeamNames();state.teamCount=Number(e.target.value);save();renderWelcome()};$('startGame').onclick=()=>{collectTeamNames();state.turn=0;state.phase='intro';state.stage=0;state.q=0;save();render()};$('seeMap').onclick=()=>{collectTeamNames();runtime.backFromMap='welcome';state.phase='map';save();render()};$('teacherRules').onclick=showHelp}
function collectTeamNames(){const old=state.teamCount;for(let i=0;i<old;i++){const x=$('teamName'+i);if(x)state.teams[i]=x.value.trim()||`Đội ${i+1}`}save()}
function tierClass(diff){return diff==='BOSS'?'boss':(diff==='KHÓ'||diff==='SIÊU KHÓ')?'hard':''}
function renderMap(){const tiles=STAGES.map((s,i)=>`<button class="map-tile ${state.completed.includes(i)?'done':''}" data-stage="${i}"><div class="tile-top"><span>${s.icon}</span><span class="number">${state.completed.includes(i)?'✓ ĐÃ QUA':'ẢI '+String(s.id).padStart(2,'0')}</span></div><strong>${escapeHTML(s.name)}</strong><small>${s.quests.length} thử thách · ${escapeHTML(s.difficulty)}</small></button>`).join('');$('app').innerHTML=`<section class="screen panel map-panel"><div class="d-flex align-items-center justify-content-between" style="gap:10px;flex-wrap:wrap;margin-bottom:20px"><div><span class="pill">🗺️ BẢN ĐỒ KHÁM PHÁ</span><h2 style="margin:13px 0 0">12 cửa ải tăng dần độ khó</h2><p class="small-meta mb-0">Giáo viên có thể bấm chọn trực tiếp bất kỳ màn nào để điều chỉnh tiến độ.</p></div><button class="btn-secondary-custom" id="mapBack">↩ Quay lại</button></div><div class="map-grid">${tiles}</div><div class="coach mt-3">💡 Chọn một chặng sẽ bắt đầu lại chặng đó; điểm đội đã tích lũy được giữ nguyên.</div></section>`;document.querySelectorAll('[data-stage]').forEach(e=>e.onclick=()=>{state.stage=Number(e.dataset.stage);state.q=0;state.phase='intro';save();render()});$('mapBack').onclick=()=>{state.phase=runtime.backFromMap||'welcome';if(state.phase==='play')state.phase='intro';save();render()}}
function hud(){let s=STAGES[state.stage];const progress=(qCountBefore(state.stage)+Math.min(state.q,s.quests.length))/TOTAL_QUESTIONS*100;const qs=(state.phase==='play')?`Câu ${state.q+1}/${s.quests.length}`:`${s.quests.length} thử thách`;return `<section class="hud"><div class="panel hud-info"><span class="stage-index">ẢI ${s.id}/12</span><span class="stage-name">${s.icon} ${escapeHTML(s.name)}</span><div class="progress-track" title="Tiến độ toàn bộ hành trình"><div class="progress-fill" style="width:${progress.toFixed(1)}%"></div></div><span class="quest-progress">${qs}</span></div><div class="panel hud-timer"><div style="text-align:center"><div class="time-caption">${state.timerOn?'THỜI GIAN':'KHÔNG GIỚI HẠN'}</div><div class="time-num" id="timerText">${state.timerOn?timeText(runtime.timerLeft):'∞'}</div></div></div></section>`}
function scoreboard(){return `<div class="scoreboard" role="group" aria-label="Điểm các đội">${state.teams.slice(0,state.teamCount).map((n,i)=>`<button type="button" class="team-score ${state.turn===i?'current':''}" data-turn="${i}" title="Bấm để chuyển lượt sang ${escapeHTML(n)}"><span class="name">${['🌟','⚡','🔥','🚀'][i]} ${escapeHTML(n)}</span><span class="points">${state.scores[i].toLocaleString('vi-VN')} <small style="font-size:10px;color:#a7b8d3">đ</small></span><div class="turn">${state.turn===i?'▶ ĐANG ĐẾN LƯỢT':'BẤM ĐỂ CHỌN ĐỘI'}</div></button>`).join('')}</div>`}
function setupTeamButtons(){document.querySelectorAll('[data-turn]').forEach(e=>e.onclick=()=>{if(runtime.feedback){showToast('Đã chốt đáp án. Hãy chuyển sang câu tiếp theo trước khi đổi đội.');return}state.turn=Number(e.dataset.turn);save();document.querySelectorAll('.team-score').forEach((x,i)=>{x.classList.toggle('current',i===state.turn);x.querySelector('.turn').textContent=i===state.turn?'▶ ĐANG ĐẾN LƯỢT':'BẤM ĐỂ CHỌN ĐỘI'});const cur=$('teamTurnName');if(cur)cur.textContent=state.teams[state.turn];sound(440,.08)})}
function renderIntro(){const s=STAGES[state.stage];runtime.timerLeft=0;$('app').innerHTML=`<div class="screen">${hud()}${scoreboard()}<section class="panel stage-intro"><div class="stage-icon">${s.icon}</div><span class="pill ${s.id>9?'warm':''}">CỬA ẢI ${String(s.id).padStart(2,'0')} / 12</span><h2>${escapeHTML(s.name)}</h2><p>${escapeHTML(s.brief)}</p><div class="stage-tags"><span>📚 ${s.quests.length} thử thách</span><span>💎 ${s.base} điểm/câu (chưa tính thưởng)</span><span>🌶️ ${escapeHTML(s.difficulty)}</span></div><div class="hero-actions" style="justify-content:center"><button class="btn-main" id="stageStart">🔥 VÀO THỬ THÁCH</button><button class="btn-secondary-custom" id="settingsBtn">⚙️ Chỉnh luật chơi</button></div></section></div>`;$('stageStart').onclick=()=>{state.phase='play';state.q=0;save();renderPlay(true)};$('settingsBtn').onclick=showSettings;setupTeamButtons()}
function prepareQuestion(){const q=STAGES[state.stage].quests[state.q];runtime.selection=null;runtime.match=Array(q.pairs?.length||0).fill('');runtime.order=q.steps?randomShuffle(q.steps):[];if(q.steps&&runtime.order.join('|')===q.steps.join('|')&&q.steps.length>1)runtime.order.reverse();runtime.memChosen=[];runtime.memOptions=q.words?randomShuffle([...q.words,...q.decoys]):[];runtime.memReveal=q.type==='memory';runtime.memStudyLeft=q.study||0;runtime.feedback=null;runtime.hint=false;runtime.startedSpeech=false;runtime.endedByTimeout=false;runtime.timerLeft=q.time||40;runtime.working=false}
function renderPlay(first=false){if(first)prepareQuestion();const s=STAGES[state.stage],q=s.quests[state.q];const typeText={choice:'CHỌN ĐÁP ÁN',tf:'ĐÚNG HAY SAI',match:'NỐI ĐÚNG CẶP',order:'SẮP XẾP QUY TRÌNH',memory:'TRÍ NHỚ 6 TỪ KHÓA',speak:'MICRO 60 GIÂY'}[q.type];$('app').innerHTML=`<div class="screen">${hud()}${scoreboard()}<div class="play-grid"><section class="panel main-card" id="questionCard"><div class="section-eyebrow"><span class="badge-level ${tierClass(s.difficulty)}">${escapeHTML(s.difficulty)}</span> <span>🎯 ${typeText}</span> <span>· Câu ${state.q+1} / ${s.quests.length}</span></div><h2 class="question-title">${escapeHTML(q.question)}</h2><p class="question-desc" id="questionInstruction">${instruction(q)}</p><div id="answerArea"></div><div id="hintArea"></div><div id="feedbackArea"></div><div class="question-footer" id="questionFooter"></div></section><aside class="panel aside-card"><div><div class="guide-title">🏁 Đội chinh phục</div><p style="font-weight:950;font-size:21px;margin-bottom:4px;color:var(--yellow)" id="teamTurnName">${escapeHTML(state.teams[state.turn])}</p><p class="small-meta">Trả lời đúng: <b style="color:#b5fbe1">+${s.base} điểm</b> trở lên</p><div class="aside-divider"></div><div class="guide-title">💡 Mẹo từ thầy/cô</div><ul class="guide-list"><li><span class="dot">✦</span><span>${escapeHTML(s.teacher)}</span></li><li><span class="dot">✦</span><span>Muốn lấy điểm, hãy giải thích <b>vì sao</b> em chọn phương án đó.</span></li></ul></div><div><div class="aside-divider"></div><div class="guide-title">🎛️ Điều khiển</div><div class="aside-actions"><button class="ghost-btn" id="extraTime">⏱️ +15 giây</button><button class="ghost-btn" id="settingsBtn">⚙️ Cài đặt</button><button class="ghost-btn" id="jumpSkip">⏭️ Bỏ qua</button><button class="ghost-btn" id="openMapSmall">🗺️ Bản đồ</button></div><div class="teacher-note mt-3"><b>📍 Ghi nhớ:</b> Học sinh phải tự kiểm tra mức độ đạt mục tiêu, không chỉ có cảm giác “mình đã học xong”.</div></div></aside></div></div>`;renderAnswer(q);renderFooter(q);setupTeamButtons();$('extraTime').onclick=()=>{if(runtime.feedback){showToast('Câu hỏi đã được chốt.');return}runtime.timerLeft+=15;updateHUD();showToast('Đã gia hạn 15 giây! ⏳')};$('settingsBtn').onclick=showSettings;$('jumpSkip').onclick=()=>{if(confirm('Bỏ qua câu này (không cộng điểm) và chuyển sang câu tiếp?'))skipQuestion()};$('openMapSmall').onclick=()=>{runtime.backFromMap='intro';state.phase='map';save();render()};if(!runtime.feedback)startTimer();}
function instruction(q){return {choice:'Chọn 1 đáp án rồi bấm Chốt đáp án. Đội cần giải thích được lí do chọn.',tf:'Đồng thanh chọn ĐÚNG hoặc SAI. Đừng chỉ đoán – hãy tìm chi tiết làm căn cứ.',match:'Mỗi dòng có một danh sách chọn. Ghép hết các cặp trước khi chốt.',order:'Dùng các nút ▲ ▼ để đưa từng bước lên/xuống đúng thứ tự.',memory:'Quan sát 6 từ khóa, sau đó che lại và chọn đủ 6 từ chính xác.',speak:'Không nhìn tài liệu. Nói bằng lời của mình; giáo viên đánh giá theo 3 tiêu chí.'}[q.type]}
function renderAnswer(q){let h='';if(['choice','tf'].includes(q.type)){const opts=q.type==='tf'?['✅ ĐÚNG','❌ SAI']:q.options;h=`<div class="choice-grid" role="group" aria-label="Các phương án trả lời">${opts.map((o,i)=>`<button class="answer-option ${runtime.selection===i?'selected':''} ${runtime.feedback?(i===q.answer?'right':i===runtime.selection?'wrong':''):''}" data-choice="${i}" ${runtime.feedback?'disabled':''}><span class="answer-key">${q.type==='tf'?(i===0?'✓':'✕'):String.fromCharCode(65+i)}</span><span>${escapeHTML(o)}</span></button>`).join('')}</div>`}else if(q.type==='match'){const choices=randomShuffle(q.pairs.map(p=>p[1]));runtime.matchPool=runtime.matchPool||choices;h=`<div class="match-rows">${q.pairs.map(([l,r],i)=>`<div class="match-row ${runtime.feedback?(runtime.match[i]===r?'right':'wrong'):''}"><div class="match-left">${escapeHTML(l)}</div><span class="match-arrow">→</span><select class="field" data-match="${i}" ${runtime.feedback?'disabled':''} aria-label="Đáp án cho ${escapeHTML(l)}"><option value="">-- Chọn --</option>${runtime.matchPool.map(choice=>`<option value="${escapeHTML(choice)}" ${runtime.match[i]===choice?'selected':''}>${escapeHTML(choice)}</option>`).join('')}</select></div>`).join('')}</div>`}else if(q.type==='order'){h=`<div class="order-list">${runtime.order.map((step,i)=>`<div class="order-item"><span class="order-position">${i+1}</span><span class="order-text">${escapeHTML(step)}</span><div class="order-actions"><button data-move="${i}" data-dir="-1" ${i===0||runtime.feedback?'disabled':''} aria-label="Chuyển bước ${i+1} lên">▲</button><button data-move="${i}" data-dir="1" ${i===runtime.order.length-1||runtime.feedback?'disabled':''} aria-label="Chuyển bước ${i+1} xuống">▼</button></div></div>`).join('')}</div>`}else if(q.type==='memory'){if(runtime.memReveal){h=`<div style="text-align:center"><p style="color:var(--yellow);font-weight:850">Hãy ghi nhớ! Còn <span class="memory-count" id="memoryClock">${runtime.memStudyLeft}</span> giây</p><div class="memory-words">${q.words.map(w=>`<div class="memory-word">${escapeHTML(w)}</div>`).join('')}</div><button class="btn-secondary-custom" id="hideWords">🙈 Che ngay – Tôi đã nhớ</button></div>`}else{h=`<p style="color:var(--yellow);font-weight:800">Chọn đủ ${q.words.length} từ khóa chính xác (${runtime.memChosen.length}/${q.words.length} đã chọn)</p><div class="memory-picks">${runtime.memOptions.map(w=>`<button class="memory-pick ${runtime.memChosen.includes(w)?'selected':''} ${runtime.feedback?(q.words.includes(w)?'correct':runtime.memChosen.includes(w)?'wrong':''):''}" data-word="${escapeHTML(w)}" ${runtime.feedback?'disabled':''}>${escapeHTML(w)}</button>`).join('')}</div>`}}else if(q.type==='speak'){h=`<div class="speak-prompts">${q.rubric.map((r,i)=>`<div><b>${i+1}.</b><span>${escapeHTML(r)}</span></div>`).join('')}</div><div class="speaking-time" id="speakingTimer">${runtime.startedSpeech?timeText(runtime.timerLeft):'01:00'}</div><div class="speak-controls" id="speakControls">${runtime.startedSpeech?'<span class="pill warm">🎙️ ĐANG TRÌNH BÀY</span>':'<button class="btn-main" id="startSpeaking">🎤 Bắt đầu 60 giây</button>'}</div><div class="coach">Giáo viên có quyền đánh giá ĐẠT nếu học sinh diễn đạt đúng các ý trọng tâm (không bắt buộc y hệt từng chữ).</div>`}$('answerArea').innerHTML=h;
 document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>choose(Number(el.dataset.choice)));
 document.querySelectorAll('[data-match]').forEach(el=>el.onchange=()=>{runtime.match[Number(el.dataset.match)]=el.value});
 document.querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>{let i=Number(el.dataset.move),j=i+Number(el.dataset.dir);[runtime.order[i],runtime.order[j]]=[runtime.order[j],runtime.order[i]];renderAnswer(q)});
 document.querySelectorAll('[data-word]').forEach(el=>el.onclick=()=>toggleWord(el.dataset.word,q));
 if($('hideWords'))$('hideWords').onclick=()=>{runtime.memReveal=false;renderAnswer(q);renderFooter(q)};
 if($('startSpeaking'))$('startSpeaking').onclick=()=>{runtime.startedSpeech=true;runtime.timerLeft=q.time;renderAnswer(q);renderFooter(q);startTimer();sound(800,.15)};
}
function choose(i){if(runtime.feedback)return;runtime.selection=i;document.querySelectorAll('[data-choice]').forEach((x,j)=>x.classList.toggle('selected',j===i));sound(480,.07)}
function toggleWord(w,q){if(runtime.feedback)return;const i=runtime.memChosen.indexOf(w);if(i>=0)runtime.memChosen.splice(i,1);else if(runtime.memChosen.length<q.words.length)runtime.memChosen.push(w);else return showToast(`Chỉ được chọn ${q.words.length} từ!`);renderAnswer(q);renderFooter(q);sound(500,.07)}
function renderFooter(q){if(runtime.feedback){$('questionFooter').innerHTML=`<button class="btn-main" id="nextQuestion">${state.q===STAGES[state.stage].quests.length-1?'🏁 Hoàn thành cửa ải':'➡️ Câu tiếp theo'}</button><span class="small-meta">Nhấn Enter để tiếp tục</span>`;$('nextQuestion').onclick=nextQuestion;return}
let action='';if(q.type==='speak'){action=runtime.startedSpeech?'<button class="btn-main" id="passSpeaking">🌟 ĐẠT – Cộng điểm</button><button class="btn-secondary-custom" id="failSpeaking">CẦN CỐ GẮNG THÊM</button>':'<span class="small-meta">Nhấn “Bắt đầu 60 giây” bên trên để mở chấm điểm.</span>'}
else if(q.type==='memory'&&runtime.memReveal)action='<span class="small-meta">👀 Đang ghi nhớ. Chờ che thẻ để trả lời.</span>';
else action='<button class="btn-main" id="submitAnswer">🔒 CHỐT ĐÁP ÁN</button>';
const hint=(!runtime.hint&&q.hint&&q.type!=='speak')?'<button class="btn-secondary-custom hint-btn" id="hintButton">💡 Gợi ý (−20% điểm)</button>':'';
$('questionFooter').innerHTML=action+hint;if($('submitAnswer'))$('submitAnswer').onclick=submitAnswer;if($('hintButton'))$('hintButton').onclick=()=>{runtime.hint=true;$('hintArea').innerHTML=`<div class="hint-box">💡 <b>Gợi ý:</b> ${escapeHTML(q.hint)}</div>`;renderFooter(q)};if($('passSpeaking'))$('passSpeaking').onclick=()=>evaluate(true,'Giáo viên đánh giá: ĐẠT');if($('failSpeaking'))$('failSpeaking').onclick=()=>evaluate(false,'Giáo viên đánh giá: CẦN CỐ GẮNG THÊM')}
function submitAnswer(){const q=STAGES[state.stage].quests[state.q];let correct=false,extra='';if(q.type==='choice'||q.type==='tf'){if(runtime.selection===null)return showToast('Hãy chọn một đáp án trước khi chốt!');correct=runtime.selection===q.answer;extra=`Đáp án: <b>${escapeHTML(q.type==='tf'?(q.answer===0?'ĐÚNG':'SAI'):q.options[q.answer])}</b>`}
else if(q.type==='match'){if(runtime.match.some(x=>!x))return showToast('Hãy ghép đủ tất cả các cặp!');correct=q.pairs.every((p,i)=>runtime.match[i]===p[1]);extra='Đáp án: '+q.pairs.map(([a,b])=>escapeHTML(a)+' → '+escapeHTML(b)).join(' · ')}
else if(q.type==='order'){correct=q.steps.every((step,i)=>runtime.order[i]===step);extra='Thứ tự chuẩn: '+q.steps.map((x,i)=>`<b>${i+1}.</b> ${escapeHTML(x)}`).join(' → ')}
else if(q.type==='memory'){if(runtime.memChosen.length!==q.words.length)return showToast('Cần chọn đủ 6 từ mới có thể chốt!');correct=q.words.every(w=>runtime.memChosen.includes(w));extra='6 từ khóa đúng: <b>'+q.words.map(escapeHTML).join(' · ')+'</b>'}else return;
 evaluate(correct,extra)}
function evaluate(correct,detail='',timeout=false){if(runtime.feedback)return;stopTimer();let s=STAGES[state.stage],q=s.quests[state.q];let points=0;if(correct){state.streak++;points=s.base;if(runtime.hint)points=Math.round(points*.8);if(state.timerOn&&q.type!=='speak'&&!timeout)points+=Math.min(12,Math.floor(Math.max(0,runtime.timerLeft)/10)*2);if(state.streak>0&&state.streak%3===0)points+=5;state.scores[state.turn]+=points;state.correct++;successSound();confetti(q.type==='speak'?55:17)}else{state.streak=0;errorSound()}state.solved++;runtime.feedback={correct,detail,points,timeout};state.history.push({stage:state.stage+1,question:state.q+1,team:state.turn,correct,points});save();renderAnswer(q);renderFooter(q);let fb=correct?'success':'error';let title=correct?['💥 CHÍNH XÁC!','🎉 TUYỆT VỜI!','🌟 XUẤT SẮC!'][Math.floor(Math.random()*3)]:timeout?'⏰ HẾT GIỜ!':'🤔 CHƯA CHÍNH XÁC';$('feedbackArea').innerHTML=`<div class="feedback ${fb}" role="status"><h3>${title}</h3>${correct?`<span class="points-earned">💎 +${points} ĐIỂM ${state.streak%3===0?' • CÓ THƯỞNG LIÊN TIẾP!':''}</span>`:'<span class="points-earned" style="color:#ffd2d9">+0 điểm • Cơ hội học lại!</span>'}<p>${detail}</p><p class="reason">💡 <b>Giải thích:</b> ${escapeHTML(q.why)}</p></div>`;document.querySelectorAll('.team-score').forEach((x,i)=>x.querySelector('.points').innerHTML=`${state.scores[i].toLocaleString('vi-VN')} <small style="font-size:10px;color:#a7b8d3">đ</small>`);updateHUD()}
function startTimer(){stopTimer();if(!state.timerOn||runtime.feedback)return;const q=STAGES[state.stage].quests[state.q];if(q.type==='speak'&&!runtime.startedSpeech)return;runtime.ticker=setInterval(()=>{if(state.phase!=='play')return stopTimer();if(q.type==='memory'&&runtime.memReveal){runtime.memStudyLeft--;const e=$('memoryClock');if(e)e.textContent=Math.max(runtime.memStudyLeft,0);if(runtime.memStudyLeft<=0){runtime.memReveal=false;renderAnswer(q);renderFooter(q);sound(800,.16)}}runtime.timerLeft=Math.max(0,runtime.timerLeft-1);updateHUD();if(q.type==='speak'&&$('speakingTimer'))$('speakingTimer').textContent=timeText(runtime.timerLeft);if(runtime.timerLeft===0){stopTimer();if(q.type==='speak'){showToast('Đã đủ 60 giây! Giáo viên hãy đánh giá lượt trình bày.');sound(340,.24)}else if(q.type==='memory'&&runtime.memReveal){runtime.memReveal=false;renderAnswer(q);renderFooter(q);evaluate(false,'Chưa kịp hoàn thành phần ghi nhớ.',true)}else evaluate(false,'Đáp án chưa được chốt trong thời gian quy định.',true)}},1000)}
function updateHUD(){const e=$('timerText');if(e){e.textContent=state.timerOn?timeText(runtime.timerLeft):'∞';e.classList.toggle('danger',state.timerOn&&runtime.timerLeft<=10&&runtime.timerLeft>0)}}
function skipQuestion(){stopTimer();state.streak=0;state.solved++;state.history.push({stage:state.stage+1,question:state.q+1,team:state.turn,correct:false,points:0,skipped:true});save();nextQuestion()}
function nextQuestion(){if(state.phase!=='play')return;stopTimer();state.turn=(state.turn+1)%state.teamCount;state.q++;runtime.matchPool=null;if(state.q>=STAGES[state.stage].quests.length){if(!state.completed.includes(state.stage))state.completed.push(state.stage);state.phase='stageend';save();render();if(STAGES[state.stage].id===12)confetti(120)}else{save();renderPlay(true)}}
function renderStageEnd(){const s=STAGES[state.stage],hist=state.history.filter(h=>h.stage===s.id),right=hist.filter(h=>h.correct).length,stats=[['Số câu',s.quests.length],['Câu đúng',right],['Điểm dẫn đầu',Math.max(...state.scores.slice(0,state.teamCount))]];$('app').innerHTML=`<div class="screen">${hud()}${scoreboard()}<section class="panel stage-end"><div class="giant">${s.id===12?'👑':'🏆'}</div><span class="pill">HOÀN THÀNH CỬA ẢI ${s.id}</span><h2 class="mt-3">${s.id===12?'Bạn đã chinh phục TRÙM CUỐI!':'Vượt ải thành công!'}</h2><p>Cả lớp đã vượt qua <b>${escapeHTML(s.name)}</b>. Sẵn sàng chinh phục thử thách tiếp theo?</p><div class="stat-row">${stats.map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div><div class="hero-actions" style="justify-content:center"><button class="btn-main" id="continueStage">${s.id===12?'👑 XEM BẢNG VINH DANH':'🚀 MỞ ẢI TIẾP THEO'}</button><button class="btn-secondary-custom" id="backMap">🗺️ Bản đồ</button></div></section></div>`;$('continueStage').onclick=()=>{if(state.stage===STAGES.length-1){state.phase='finish'}else{state.stage++;state.q=0;state.phase='intro'}save();render()};$('backMap').onclick=()=>{runtime.backFromMap='stageend';state.phase='map';save();render()};setupTeamButtons()}
function renderFinish(){const standings=state.teams.slice(0,state.teamCount).map((name,i)=>({name,score:state.scores[i],i})).sort((a,b)=>b.score-a.score),emoji=['🥇','🥈','🥉','🏅'];$('app').innerHTML=`<section class="screen panel stage-end"><div class="giant">👑</div><span class="pill warm">LỄ VINH DANH HỌC BÁ</span><h1 class="mega-title" style="font-size:clamp(36px,5vw,70px)">NHÀ VÔ ĐỊCH<br><span class="gradient-text">TỰ HỌC CÓ ĐỊNH HƯỚNG</span></h1><p>Các đội đã cùng khám phá: xác định mục tiêu – chọn cách học – tự kiểm tra – điều chỉnh và thử lại.</p><div class="winner-list">${standings.map((x,j)=>`<div class="winner-team ${j===0?'first':''}"><div class="medal">${emoji[j]}</div><span>${escapeHTML(x.name)}</span><b>${x.score.toLocaleString('vi-VN')} điểm</b></div>`).join('')}</div><div class="panel" style="max-width:740px;margin:24px auto;background:#091a38;padding:22px;text-align:left"><h3 style="font-weight:950;color:var(--cyan)">🎓 4 bí kíp mang về sau trò chơi</h3><p>🎯 <b>Bước 1:</b> Xác định cần học gì và đích cần đạt.</p><p>📚 <b>Bước 2:</b> Chọn cách học phù hợp: nhớ – làm được – hiểu.</p><p>🔎 <b>Bước 3:</b> Học xong tự kiểm tra bằng nhiệm vụ thật.</p><p style="margin:0">🔄 <b>Bước 4:</b> Chưa đạt thì đổi cách học, thử lại và đối chiếu.</p></div><div class="hero-actions" style="justify-content:center"><button class="btn-main" id="dlCSV">📥 TẢI BẢNG ĐIỂM</button><button class="btn-secondary-custom" id="doAgain">🔄 Chơi lại từ đầu</button><button class="btn-secondary-custom" id="finishMap">🗺️ Xem cửa ải</button></div><p class="coach" style="justify-content:center;margin-top:24px">“Học có mục tiêu – Luyện có phương pháp – Kiểm tra để tiến bộ!” ✨</p></section>`;$('dlCSV').onclick=downloadCSV;$('doAgain').onclick=()=>{if(confirm('Bắt đầu một cuộc thi mới? Điểm cũ sẽ được đặt lại (hãy xuất bảng điểm trước nếu muốn giữ).')){state=DEFAULT_STATE();save();render()}};$('finishMap').onclick=()=>{runtime.backFromMap='finish';state.phase='map';save();render()};confetti(75)}
function openMap(){if(state.phase==='map'){state.phase=runtime.backFromMap||'welcome';if(state.phase==='play')state.phase='intro'}else{runtime.backFromMap=state.phase==='play'?'intro':state.phase;state.phase='map'}save();render()}
$('btnMap').onclick=openMap;$('btnHelp').onclick=showHelp;$('btnSound').onclick=controlSound;$('btnFull').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>showToast('Trình duyệt không hỗ trợ toàn màn hình.'))}else document.exitFullscreen?.()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalLayer').innerHTML){closeModal();return}if($('modalLayer').innerHTML)return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(state.phase==='play'){const q=STAGES[state.stage].quests[state.q];if(['choice','tf'].includes(q.type)&&!runtime.feedback&&/^[1-4]$/.test(e.key)){const i=Number(e.key)-1;if(i<(q.type==='tf'?2:q.options.length))choose(i)}if(e.key==='Enter'){e.preventDefault();if(runtime.feedback)nextQuestion();else if(q.type!=='speak'&&!(q.type==='memory'&&runtime.memReveal))submitAnswer()}}});
// Lưu câu trước đó nhưng luôn khởi động lại câu đang dở khi mở trang để tránh đồng hồ treo.
render();
</script>
</body>
</html>
